<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Local Spotify</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231db954'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
</head>
<body class="admin-body">
<div class="admin-wrap">
  <header class="admin-header">
    <div>
      <h1>⚙ Library Admin</h1>
      <div class="muted" id="admin-stats"></div>
    </div>
    <div class="admin-header-actions">
      <button class="ghost-btn" id="admin-rescan">⟳ Rescan folder</button>
      <a class="ghost-btn" href="/">← Back to player</a>
    </div>
  </header>

  <section class="admin-section">
    <h2>Add music</h2>
    <div id="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">⬆</div>
        <div><b>Drop audio files here</b> or <label class="dz-browse">browse<input id="file-input" type="file" multiple accept=".mp3,.flac,.ogg,.oga,.opus,.wav,.m4a,.aac,.webm,audio/*" hidden></label></div>
        <div class="muted">MP3 · FLAC · OGG · WAV · M4A — fill in the details, then upload</div>
      </div>
    </div>
    <div id="upload-queue"></div>
    <div id="upload-actions" hidden>
      <button class="accent-btn" id="upload-all">Upload all</button>
      <button class="ghost-btn" id="clear-queue">Clear</button>
      <span class="muted" id="upload-status"></span>
    </div>
  </section>

  <section class="admin-section">
    <h2>Manage tracks</h2>
    <input id="admin-filter" type="search" placeholder="Filter by title, artist, or album…">
    <div class="tm-toolbar">
      <label class="tm-select-all"><input type="checkbox" id="tm-select-all"> <span id="tm-select-all-label">Select all</span></label>
      <button id="tm-delete-selected" class="ghost-btn danger" disabled>Delete selected</button>
      <span class="muted" id="tm-selection-count"></span>
    </div>
    <div id="track-manager"></div>
  </section>
</div>
<script src="/admin.js"></script>
</body>
</html>
