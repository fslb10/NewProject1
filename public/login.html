<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Local Spotify</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231db954'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }
  .login-card {
    background: var(--bg-raised);
    border-radius: 12px;
    padding: 40px 36px;
    width: min(380px, 92vw);
    text-align: center;
    box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  .login-card .logo { font-size: 30px; margin-bottom: 6px; padding: 0; }
  .login-card h1 { font-size: 19px; font-weight: 700; margin: 0 0 22px; }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    background: #121212;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card button {
    width: 100%;
    padding: 12px;
    border-radius: 24px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .login-card button:hover { filter: brightness(1.08); }
  .login-card button:disabled { opacity: .6; cursor: default; }
  .login-error { color: #f15e6c; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  .login-hint { color: var(--text-dim); font-size: 12.5px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<form class="login-card" id="login-form">
  <div class="logo">♫</div>
  <h1>Local Spotify</h1>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <div class="login-error" id="login-error"></div>
  <button type="submit" id="login-btn">Sign in</button>
  <div class="login-hint" id="login-hint">Enter the password you were given.<br>Admin? Use the admin password.</div>
</form>
<script>
'use strict';
if (new URLSearchParams(location.search).get('admin')) {
  document.getElementById('login-hint').innerHTML =
    'That page needs the <b>admin</b> password.<br>Sign in with it to continue.';
}
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled = true;
  errEl.textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'sign-in failed');
    location.href = new URLSearchParams(location.search).get('admin') && data.role === 'admin' ? '/admin' : '/';
  } catch (err) {
    errEl.textContent = err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
