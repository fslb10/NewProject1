<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Spotify</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231db954'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">♫ <span>Local Spotify</span></div>
    <nav>
      <button class="nav-item active" data-view="home">🏠 Home</button>
      <button class="nav-item" data-view="search">🔍 Search</button>
      <button class="nav-item" data-view="library">📚 Your Library</button>
      <button class="nav-item" data-view="liked">💚 Liked Songs</button>
    </nav>
    <div class="playlists-header">
      <span>PLAYLISTS</span>
      <button id="new-playlist" title="New playlist">＋</button>
    </div>
    <div id="playlist-list"></div>
    <div class="sidebar-footer">
      <button id="rescan" title="Rescan music folder">⟳ Rescan library</button>
      <a id="admin-link" href="/admin" title="Add songs and edit info">⚙ Manage library</a>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
  </main>

  <footer id="player">
    <div class="now-playing">
      <img id="np-art" src="" alt="" hidden>
      <div class="np-text">
        <div id="np-title">Nothing playing</div>
        <div id="np-artist"></div>
      </div>
      <button id="np-like" class="icon-btn" title="Like" hidden>♡</button>
    </div>
    <div class="player-center">
      <div class="transport">
        <button id="btn-shuffle" class="icon-btn" title="Shuffle">🔀</button>
        <button id="btn-prev" class="icon-btn" title="Previous">⏮</button>
        <button id="btn-play" class="play-btn" title="Play/Pause">▶</button>
        <button id="btn-next" class="icon-btn" title="Next">⏭</button>
        <button id="btn-repeat" class="icon-btn" title="Repeat">🔁</button>
      </div>
      <div class="seek-row">
        <span id="time-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="time-dur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button id="btn-queue" class="icon-btn" title="Queue">☰</button>
      <span class="vol-icon">🔊</span>
      <input id="volume" type="range" min="0" max="100" value="80">
    </div>
  </footer>

  <div id="queue-panel" hidden>
    <div class="queue-head"><span>Queue</span><button id="queue-close" class="icon-btn">✕</button></div>
    <div id="queue-list"></div>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
<script src="/app.js"></script>
</body>
</html>
