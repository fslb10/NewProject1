<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Spotify</title>
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Local Spotify">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231db954'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='black' font-family='sans-serif' font-weight='bold'%3E%E2%99%AB%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">♫ <span>Local Spotify</span></div>
    <nav>
      <button class="nav-item active" data-view="home">🏠 Home</button>
      <button class="nav-item" data-view="search">🔍 Search</button>
      <button class="nav-item" data-view="library">📚 Your Library</button>
      <button class="nav-item" data-view="liked">💚 Liked Songs</button>
    </nav>
    <div class="playlists-header">
      <span>PLAYLISTS</span>
      <button id="new-playlist" title="New playlist">＋</button>
    </div>
    <div id="playlist-list"></div>
    <div class="sidebar-footer">
      <button id="share-qr" title="QR code for this address">📱 Share</button>
      <button id="rescan" title="Rescan music folder">⟳ Rescan library</button>
      <a id="admin-link" href="/admin" title="Add songs and edit info">⚙ Manage library</a>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
  </main>

  <footer id="player">
    <div class="now-playing">
      <img id="np-art" src="" alt="" hidden>
      <div class="np-text">
        <div id="np-title">Nothing playing</div>
        <div id="np-artist"></div>
      </div>
      <button id="np-like" class="icon-btn" title="Like" hidden>♡</button>
      <button id="np-dl" class="icon-btn" title="Download this song" hidden>⬇</button>
    </div>
    <div class="player-center">
      <div class="transport">
        <button id="btn-shuffle" class="icon-btn" title="Shuffle">🔀</button>
        <button id="btn-prev" class="icon-btn" title="Previous">⏮</button>
        <button id="btn-play" class="play-btn" title="Play/Pause">▶</button>
        <button id="btn-next" class="icon-btn" title="Next">⏭</button>
        <button id="btn-repeat" class="icon-btn" title="Repeat">🔁</button>
      </div>
      <div class="seek-row">
        <span id="time-cur">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0">
        <span id="time-dur">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button id="btn-radio" class="icon-btn" title="Radio — keep playing similar songs">📻</button>
      <button id="btn-sleep" class="icon-btn" title="Sleep timer">🌙</button>
      <button id="btn-queue" class="icon-btn" title="Queue">☰</button>
      <span class="vol-icon">🔊</span>
      <input id="volume" type="range" min="0" max="100" value="80">
    </div>
  </footer>

  <div id="queue-panel" hidden>
    <div class="queue-head"><span>Queue</span><button id="queue-close" class="icon-btn">✕</button></div>
    <div id="queue-list"></div>
  </div>

  <nav id="tabbar">
    <button class="tab-item active" data-view="home">🏠<span>Home</span></button>
    <button class="tab-item" data-view="search">🔍<span>Search</span></button>
    <button class="tab-item" data-view="library">📚<span>Library</span></button>
    <button class="tab-item" data-view="liked">💚<span>Liked</span></button>
  </nav>

  <div id="np-full" hidden>
    <canvas id="npf-viz"></canvas>
    <button id="npf-close" title="Close">⌄</button>
    <img id="npf-art" src="" alt="">
    <div id="npf-title"></div>
    <div id="npf-artist"></div>
    <div class="seek-row">
      <span id="npf-cur">0:00</span>
      <input id="npf-seek" type="range" min="0" max="1000" value="0">
      <span id="npf-dur">0:00</span>
    </div>
    <div class="transport">
      <button id="npf-shuffle" class="icon-btn" title="Shuffle">🔀</button>
      <button id="npf-prev" class="icon-btn" title="Previous">⏮</button>
      <button id="npf-play" class="play-btn" title="Play/Pause">▶</button>
      <button id="npf-next" class="icon-btn" title="Next">⏭</button>
      <button id="npf-repeat" class="icon-btn" title="Repeat">🔁</button>
    </div>
    <div class="npf-extra">
      <button id="npf-like" class="icon-btn" title="Like">♡</button>
      <button id="npf-radio" class="icon-btn" title="Radio — keep playing similar songs">📻</button>
      <button id="npf-sleep" class="icon-btn" title="Sleep timer">🌙</button>
      <button id="npf-viz-btn" class="icon-btn" title="Visualizer on/off">📊</button>
      <button id="npf-dl" class="icon-btn" title="Download">⬇</button>
    </div>
  </div>
</div>
<audio id="audio" preload="auto"></audio>
<script src="/app.js"></script>
</body>
</html>
